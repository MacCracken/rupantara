name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. Nothing here writes to the repository, and when release.yml calls
# this workflow the called side can only lower the caller's permissions, so the CI
# gate never holds the release job's contents: write (0.5.2; it inherited it before).
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved); the
      # comment names the release the SHA was resolved from (git ls-remote, 2026-11-09).
      # persist-credentials: false keeps the token out of .git/config, where the
      # curl | sh installer below could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The version is the cyrius.cyml pin — the single source of truth.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # Reads [deps] from cyrius.cyml: the stdlib leaves, and rosnet (git + tag), which
        # brings tyche in transitively. lib/ must be a real dir.
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        # Hard gate over every Cyrius source: the library, programs, suites, the shared
        # test helpers / oracles, the benchmark and the fuzz harness (0.5.2 widened it
        # from src/, programs/ and the suites).
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/*.cyr tests/*.bcyr tests/*.fcyr; do
            [ -e "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*(warn|error) '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/*.cyr tests/*.bcyr tests/*.fcyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Doc check
        # Every public fn in src/ carries a doc comment (cyrdoc exits 1 otherwise).
        run: cyrius doc --check src/*.cyr

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist/ is in sync with src/
        # Consumers import dist/rupantara.cyr and `cyrius deps` reads its .deps sidecar:
        # both must match the commit. distlib is byte-deterministic, so a diff after
        # regenerating is a valid gate (0.5.2: the sidecar was not checked before).
        run: |
          cyrius distlib
          if ! git diff --exit-code dist/ || [ -n "$(git status --porcelain dist/)" ]; then
            echo "ERROR: dist/ is stale. Run 'cyrius distlib' and commit."
            exit 1
          fi
          echo "dist/ matches src/"

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/rupantara_smoke
          echo "smoke: $(wc -c < build/rupantara_smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/rupantara_smoke | grep -q "7f45 4c46"

      - name: Run smoke
        run: ./build/rupantara_smoke

      - name: Build the GPU crown program
        # programs/gpulayer.cyr is the AGNOS #83 proof; on Linux it is compile-checked
        # here (no device), its tiling is pinned by tests/tcyr/gpu.tcyr.
        run: cyrius build programs/gpulayer.cyr build/gpulayer

      - name: Test (CPU-only suites)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Fuzz
        # Seeded property fuzzing (tests/rupantara.fcyr): 20,000 rounds of random configs
        # and inputs against the oracles in tests/reference.cyr. Exit 1 = a property failed.
        run: |
          CYRIUS_DCE=1 cyrius build tests/rupantara.fcyr build/rupantara-fuzz
          timeout 120 ./build/rupantara-fuzz || { echo "FUZZ: property failure, crash or timeout"; exit 1; }

      - name: Benchmarks
        # Informational (CI hosts are noisy); scripts/bench-history.sh records numbers.
        run: CYRIUS_DCE=1 cyrius bench tests/rupantara.bcyr

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan for dangerous patterns
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ programs/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then echo "FAIL: $label"; echo "$hits"; FAIL=1; fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml LICENSE SECURITY.md dist/rupantara.cyr; do
            if [ -f "$f" ]; then echo "  OK: $f"; else echo "  MISSING: $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md; do
            if [ -f "$f" ]; then echo "  OK: $f"; else echo "  WARN (optional): $f"; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          # rupantara_version() packs major*10000 + minor*100 + patch; it drifted at 0.4.1 and 0.4.3.
          PACKED=$(echo "$VERSION" | awk -F. '{ print $1*10000 + $2*100 + $3 }')
          ACTUAL=$(awk '/^fn rupantara_version\(/ { f=1 } f && /return/ { gsub(/[^0-9]/, ""); print; exit }' src/blocks.cyr)
          [ "$ACTUAL" = "$PACKED" ] || { echo "FAIL: rupantara_version() returns $ACTUAL, VERSION $VERSION packs to $PACKED"; exit 1; }
          echo "Version consistent: $VERSION ($PACKED)"
